<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Державний Архів - Архівіус</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="imperial-header">
        <div class="logo">👑 ІМПЕРСЬКИЙ ПОРТАЛ</div>
        <nav class="navigation">
            <a href="index.html">Головний Штаб</a>
            <a href="scout.html">🛰️ Ситуаційний Центр</a>
            <a href="archive.html" class="active">📜 Державний Архів</a>
        </nav>
    </header>

    <main class="container">
        <div class="workspace-card">
            <h2>📜 Вузол Архівіуса: Репозиторій Державних Хронік</h2>
            <p>Останні зареєстровані та збережені документи в системі Supabase.</p>
            
            <div id="archivist-status-message" class="info-alert" style="display:none;"></div>
            
            <div class="archive-list" id="archive-container">
                <p style="text-align: center; color: #a1a1aa;">Архівні записи завантажуються з бази даних...</p>
            </div>
        </div>
    </main>

    <script>
        // Простий скрипт для завантаження записів (якщо є ендпоінт)
        // Для демонстрації, якщо база пуста, покажемо статус
        const statusMsg = localStorage.getItem('last_archived');
        if (statusMsg) {
            const alertBox = document.getElementById('archivist-status-message');
            alertBox.style.display = 'block';
            alertBox.innerText = statusMsg;
            localStorage.removeItem('last_archived');
        }
    </script>
</body>
</html>
