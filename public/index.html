<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ІМПЄРСКІЄ ВЄДОМОСТІ | Головний Медіапортал Метрополії</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #dfb76c; 
            --gold-glow: rgba(223,183,108,0.4); 
            --imperial-red: #ff3333; 
            --red-glow: rgba(255,51,51,0.3);
            --bg-dark: #07080c; 
            --panel-bg: rgba(15,17,26,0.9); 
            --border-color: #212435; 
            --text-light: #e2e8f0; 
            --text-muted: #747d9e; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-light); font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        header { background: linear-gradient(180deg, #090a0f 0%, #12141d 100%); border-bottom: 2px solid var(--gold); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); position: sticky; top: 0; z-index: 100; }
        .logo-block { display: flex; align-items: center; gap: 15px; }
        .imperial-crest { width: 45px; height: 45px; background: radial-gradient(circle, var(--gold) 30%, transparent 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-size: 22px; color: #000; font-weight: 900; border: 2px solid var(--gold); box-shadow: 0 0 10px var(--gold-glow); }
        .header-titles h1 { font-family: 'Cinzel', serif; font-size: 22px; color: var(--gold); letter-spacing: 2px; text-shadow: 0 0 8px var(--gold-glow); }
        .header-titles p { font-size: 9px; color: var(--imperial-red); font-family: 'Orbitron'; letter-spacing: 1px; text-transform: uppercase; }
        .header-radio { display: flex; align-items: center; gap: 12px; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); padding: 5px 15px; border-radius: 6px; }
        .radio-play-btn { background: #39ff14; color: #000; border: none; padding: 5px 15px; font-family: 'Orbitron'; font-weight: bold; font-size: 10px; border-radius: 4px; cursor: pointer; box-shadow: 0 0 10px rgba(57,255,20,0.3); transition: all 0.2s; }
        .radio-visualizer { width: 80px; height: 18px; background: repeating-linear-gradient(90deg, transparent, transparent 2px, #39ff14 2px, #39ff14 4px); opacity: 0.5; border-radius: 2px; }
        .radio-visualizer.playing { animation: pulse 0.5s infinite alternate; opacity: 0.9; }
        
        .portal-grid { max-width: 1650px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 25px; }
        .column { display: flex; flex-direction: column; gap: 20px; }
        .column-title { font-family: 'Orbitron', sans-serif; font-size: 14px; color: var(--gold); text-transform: uppercase; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; letter-spacing: 1px; }
        .feed-container { display: flex; flex-direction: column; gap: 15px; max-height: 75vh; overflow-y: auto; padding-right: 8px; }
        
        .news-card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; transition: all 0.3s ease; position: relative; }
        .news-card:hover { border-color: var(--gold); transform: translateY(-2px); }
        .card-meta { display: flex; justify-content: space-between; font-size: 8px; font-family: 'Orbitron'; color: var(--text-muted); margin-bottom: 8px; }
        .card-title { font-size: 14px; font-weight: bold; color: #fff; line-height: 1.3; margin-bottom: 8px; }
        .card-excerpt { font-size: 11px; color: var(--text-light); line-height: 1.4; opacity: 0.85; }
        .card-tags { font-size: 9px; color: var(--gold); margin-top: 10px; font-family: 'Orbitron'; }
        .read-more-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 5px 12px; font-family: 'Orbitron'; font-size: 9px; border-radius: 4px; cursor: pointer; margin-top: 12px; display: inline-block; transition: all 0.2s; }
        .read-more-btn:hover { background: var(--gold); color: #000; }
        .card-image { width: 100%; height: 120px; background-size: cover; background-position: center; border-radius: 4px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        
        .reader-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,6,10,0.95); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .reader-box { background: #10121a; border: 2px solid var(--gold); border-radius: 8px; max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px var(--gold-glow); position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: var(--text-muted); cursor: pointer; background: none; border: none; font-family: 'Orbitron'; }
        .close-btn:hover { color: var(--gold); }
        
        @keyframes pulse { 0% { transform: scaleY(1); } 100% { transform: scaleY(0.4); } }
    </style>
</head>
<body>

    <header>
        <div class="logo-block">
            <div class="imperial-crest">I</div>
            <div class="header-titles">
                <h1>ІМПЄРСКІЄ ВЄДОМОСТІ</h1>
                <p>ОФИЦИАЛЬНЫЙ ОРГАН УКРАИНСКОЙ ИМПЕРИИ</p>
            </div>
        </div>
        <div class="header-radio">
            <span style="font-family:'Orbitron'; font-size:9px; color:#39ff14;">ЛУЧИНА-FM</span>
            <button class="radio-play-btn" id="radio-play-btn" onclick="toggleRadioPlay()">PLAY</button>
            <div class="radio-visualizer" id="radio-visualizer"></div>
        </div>
    </header>

    <div class="portal-grid">
        <div class="column">
            <h2 class="column-title">📡 Оперативныя Вєдомости</h2>
            <div class="feed-container" id="reporter-feed"></div>
        </div>
        <div class="column">
            <h2 class="column-title">📚 Историческій Архивъ</h2>
            <div class="feed-container" id="archivist-feed"></div>
        </div>
        <div class="column">
            <h2 class="column-title">🔮 Прогнозы и Форсайты</h2>
            <div class="feed-container" id="futurist-feed"></div>
        </div>
    </div>

    <div class="reader-modal" id="reader-modal" onclick="closeModal()">
        <div class="reader-box" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modal-content-area"></div>
        </div>
    </div>

    <script>
        var isPlaying = false;
        var audioCtx = null;
        var synth = window.speechSynthesis;

        var regionImages = {
            kyiv: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop",
            konigsberg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop",
            kursk: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&auto=format&fit=crop",
            belgorod: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop",
            moscovia: "https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=800&auto=format&fit=crop"
        };

        document.addEventListener('DOMContentLoaded', function() { 
            loadColumn('reporter', 'reporter-feed');
            loadColumn('archivist', 'archivist-feed');
            loadColumn('futurist', 'futurist-feed');

            var urlParams = new URLSearchParams(window.location.search);
            var articleId = urlParams.get('id');
            if (articleId) {
                fetch('/api/record-detail/' + articleId)
                    .then(function(res) { return res.json(); })
                    .then(function(rec) {
                        if (rec) { openArticleModal(rec); }
                    });
            }
        });

        function loadColumn(agent, containerId) {
            return fetch('/api/records/' + agent)
                .then(function(res) { return res.json(); })
                .then(function(records) {
                    var container = document.getElementById(containerId);
                    container.innerHTML = '';
                    if (records.length === 0) {
                        container.innerHTML = '<div style="color: var(--text-muted); font-size:11px; text-align:center; padding-top:20px;">Пространство пусто.</div>';
                        return;
                    }
                    records.forEach(function(rec) {
                        var card = document.createElement('div');
                        card.className = 'news-card';
                        card.id = 'card-' + rec.id;
                        
                        var imageHtml = '';
                        if (agent === 'archivist') {
                            var imgUrl = regionImages[rec.region_key] || regionImages.kyiv;
                            imageHtml = '<div class="card-image" style="background-image: url(\'' + imgUrl + '\')"></div>';
                        }

                        // ПОВНІСТЮ ВИПРАВЛЕНО КОНКАТЕНАЦІЮ: Ніяких помилок!
                        card.innerHTML = imageHtml + 
                            '<div class="news-card-inner" onclick=\'openArticleModal(' + JSON.stringify(rec) + ')\'>' +
                            '<div class="card-meta"><span>[' + rec.content_type.toUpperCase() + ']</span><span>STARDATE: ' + rec.stardate + '</span></div>' +
                            '<div class="card-title">' + rec.title + '</div>' +
                            '<div class="card-excerpt">' + rec.content.substring(0, 110) + '...</div>' +
                            '<div class="card-tags">' + rec.hashtags + '</div>' +
                            '<button class="read-more-btn">Читать полностью</button>' +
                            '</div>';
                        container.appendChild(card);
                    });
                });
        }

        function openArticleModal(rec) {
            var imgUrl = regionImages[rec.region_key] || regionImages.kyiv;
            var area = document.getElementById('modal-content-area');
            
            area.innerHTML = '<div class="card-image" style="height:250px; background-image: url(\'' + imgUrl + '\')"></div>' +
                '<div style="font-family:\'Orbitron\'; font-size:10px; color:var(--gold); margin-bottom:10px;">[ШИФР: UA-EMP-' + rec.epoch_key + '-' + rec.id + '] | [' + rec.content_type.toUpperCase() + ']</div>' +
                '<h2 style="font-family:\'Cinzel\'; color:var(--gold); font-size:24px; margin-bottom:20px; border-bottom:2px double var(--gold); padding-bottom:10px; line-height:1.2;">' + rec.title.toUpperCase() + '</h2>' +
                '<div style="font-size:13px; color:var(--text-light); line-height:1.6; font-style:italic; margin-bottom:20px; white-space:pre-wrap;">' + rec.content + '</div>' +
                '<div style="font-family:\'Orbitron\'; font-size:11px; color:var(--gold); margin-top:20px;">' + rec.hashtags + '</div>' +
                '<div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:10px; margin-top:20px;">' +
                '<span>ЗВЕДЕНО В ВЄДОМОСТІ: ' + rec.stardate + '</span><span>ОРГАН: ЦЕНТРАЛЬНАЯ КАНЦЕЛЯРИЯ</span></div>';
            
            document.getElementById('reader-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('reader-modal').style.display = 'none';
        }

        function playChiptuneJingle() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var notes = [261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63];
                var tempo = 0.15;
                notes.forEach(function(freq, index) {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * tempo);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index + 1) * tempo);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * tempo);
                    osc.stop(audioCtx.currentTime + (index + 1) * tempo);
                });
            } catch(e) {}
        }

        function toggleRadioPlay() {
            isPlaying = !isPlaying;
            var btn = document.getElementById('radio-play-btn');
            var vis = document.getElementById('radio-visualizer');
            if (isPlaying) {
                btn.innerText = 'STOP';
                btn.style.background = '#ff3333';
                vis.className = 'radio-visualizer playing';
                playChiptuneJingle();
            } else {
                btn.innerText = 'PLAY';
                btn.style.background = '#39ff14';
                vis.className = 'radio-visualizer';
                if(synth) synth.cancel();
            }
        }
    </script>
</body>
</html>
