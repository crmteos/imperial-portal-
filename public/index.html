<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Імперський Командний Центр | Imperial Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Orbitron:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #dfb76c; --gold-glow: rgba(223,183,108,0.4); --imperial-red: #ff3333; --bg-dark: #0a0b10; --panel-bg: rgba(18,20,28,0.85); --border-color: #2c2f3f; --text-light: #e2e8f0; --text-muted: #8a92b2; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg-dark); color: var(--text-light); font-family: 'Montserrat', sans-serif; min-height: 100vh; }
        header { background: linear-gradient(180deg, #0a0b10 0%, #12141c 100%); border-bottom: 2px solid var(--gold); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .imperial-crest { width: 45px; height: 45px; background: radial-gradient(circle, var(--gold) 30%, transparent 70%); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron'; font-size: 22px; color: #000; font-weight: 900; border: 2px solid var(--gold); }
        .dashboard-container { max-width: 1650px; margin: 25px auto; padding: 0 20px; display: grid; grid-template-columns: 1.2fr 1.3fr 1fr; gap: 20px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-top: 3px solid var(--gold); border-radius: 6px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .panel-title { font-family: 'Orbitron'; font-size: 15px; color: var(--gold); text-transform: uppercase; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .tabs-menu { display: flex; flex-wrap: wrap; gap: 5px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 4px; }
        .tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px; font-size: 11px; font-family: 'Orbitron'; cursor: pointer; flex: 1; text-align: center; }
        .tab-btn.active { background: var(--gold); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--gold-glow); }
        .workspace-content { background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 4px; height: 360px; overflow-y: auto; padding: 15px; }
        .record-card { background: rgba(255,255,255,0.02); border-left: 3px solid var(--gold); padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .record-card.scribe-card { border-left-color: var(--imperial-red); }
        .record-card.reporter-card { border-left-color: #39ff14; }
        .record-card.futurist-card { border-left-color: #00f0ff; }
        .record-meta { display: flex; justify-content: space-between; font-size: 9px; font-family: 'Orbitron'; color: var(--text-muted); margin-bottom: 5px; }
        .record-title { font-size: 13px; font-weight: bold; color: #fff; }
        .record-body { font-size: 11px; line-height: 1.4; margin-top: 5px; }
        .workspace-form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea, button { background: #12141c; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 4px; font-family: inherit; }
        button { background: linear-gradient(135deg, #a87e3b, #dfb76c); color: #000; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; border: none; }
        .chat-messages { height: 280px; overflow-y: auto; border: 1px solid var(--border-color); background: rgba(0,0,0,0.3); padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { max-width: 85%; padding: 10px; border-radius: 6px; font-size: 12px; }
        .msg-system { background: rgba(223,183,108,0.1); border-left: 2px solid var(--gold); align-self: flex-start; }
        .msg-user { background: rgba(255,51,51,0.1); border-right: 2px solid var(--imperial-red); align-self: flex-end; }
        .msg-sender { font-family: 'Orbitron'; font-size: 9px; color: var(--gold); }
        .map-container { height: 320px; background: #000; border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; }
        .map-nav { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
        .nav-chip { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: var(--text-light); padding: 5px 10px; font-size: 10px; border-radius: 20px; cursor: pointer; font-family: 'Orbitron'; }
        .nav-chip.active { background: var(--gold); color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="imperial-crest">I</div>
            <div>
                <h1 style="font-family: 'Cinzel'; font-size: 20px; color: var(--gold);">ІМПЕРСЬКИЙ ПОРТАЛ</h1>
                <p style="font-size: 9px; color: var(--imperial-red); font-family: 'Orbitron';">КАНЦЕЛЯРІЯ ✖ ШІ-ІНФЛЮЕНСЕРИ</p>
            </div>
        </div>
        <div style="font-family: 'Orbitron'; font-size: 12px;">СТАТУС: <span style="color: #39ff14;">СИНХРОНІЗАЦІЯ</span></div>
    </header>

    <div class="dashboard-container">
        <div class="panel">
            <h2 class="panel-title">✍️ Робочі Простори Канцелярії</h2>
            <div class="tabs-menu">
                <button class="tab-btn active" onclick="switchWorkspace('archivist')">📚 Архів</button>
                <button class="tab-btn" onclick="switchWorkspace('reporter')">📡 Новини</button>
                <button class="tab-btn" onclick="switchWorkspace('futurist')">🔮 Прогноз</button>
                <button class="tab-btn" onclick="switchWorkspace('geographer')">🗺️ Географ</button>
                <button class="tab-btn" onclick="switchWorkspace('scribe')">📜 Писар</button>
            </div>
            <div class="workspace-content" id="workspace-records"></div>
            <div class="workspace-form">
                <input type="text" id="record-title" placeholder="Заголовок запису...">
                <textarea id="record-content" placeholder="Дані..." rows="2"></textarea>
                <button onclick="publishRecord()">Опублікувати</button>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">🌌 Супутниковий Атлас (Google Maps)</h2>
            <div class="map-nav">
                <div class="nav-chip active" onclick="flyToKraj('kyiv', 50.4501, 30.5234)">🇺🇦 Метрополія</div>
                <div class="nav-chip" onclick="flyToKraj('konigsberg', 54.7104, 20.4522)">🇩🇪 Пруссія</div>
                <div class="nav-chip" onclick="flyToKraj('kursk', 51.7373, 36.1874)">🎯 Курськ</div>
                <div class="nav-chip" onclick="flyToKraj('belgorod', 50.5936, 36.5873)">🎯 Бєлгород</div>
                <div class="nav-chip" onclick="flyToKraj('moscovia', 55.7558, 37.6173)">🏚️ Московія</div>
            </div>
            <div class="map-container">
                <iframe id="google-map-iframe" width="100%" height="100%" frameborder="0" style="border:0;" src="https://maps.google.com/maps?q=50.4501,30.5234&t=k&z=6&output=embed"></iframe>
            </div>
            <div id="map-details" style="font-size: 11px; background: rgba(0,0,0,0.3); padding: 10px; border-radius:4px;">
                <strong>Супутниковий моніторинг Метрополії активовано.</strong>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">🎙️ Ефір та Координація ШІ</h2>
            <div class="chat-messages" id="chat-messages"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chat-input" placeholder="Меседж у мережу..." style="flex:1;">
                <button onclick="sendChatMessage()">ОК</button>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'archivist';
        const geographyDB = {
            kyiv: { name: 'Метрополія (Київ)', desc: 'Джерело суверенітету Імперії. Системи ППО активовані.' },
            konigsberg: { name: 'Прусський край (Кенігсберг)', desc: 'Стратегічний балтійський аванпост.' },
            kursk: { name: 'Курський край', desc: 'Прикордонна зона під повним управлінням Метрополії.' },
            belgorod: { name: 'Бєлгородський край', desc: 'Укріплений сектор стабілізації.' },
            moscovia: { name: 'Московія (Периферія)', desc: 'Демілітаризований край під наглядом Інквізиції.' }
        };

        document.addEventListener('DOMContentLoaded', () => { loadRecords(); loadChat(); });

        function switchWorkspace(agent) {
            currentAgent = agent;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadRecords();
        }

        function flyToKraj(key, lat, lng) {
            document.querySelectorAll('.nav-chip').forEach(chip => chip.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('google-map-iframe').src = `https://maps.google.com/maps?q=${lat},${lng}&t=k&z=9&output=embed`;
            const geo = geographyDB[key];
            document.getElementById('map-details').innerHTML = `<strong>${geo.name}</strong><br>${geo.desc}`;
        }

        async function loadRecords() {
            const res = await fetch(`/api/records/${currentAgent}`);
            const records = await res.json();
            const container = document.getElementById('workspace-records');
            container.innerHTML = '';
            if(records.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); font-size:12px; text-align:center; margin-top:50px;">Простір порожній.</div>';
                return;
            }
            records.forEach(rec => {
                const card = document.createElement('div');
                card.className = `record-card ${currentAgent}-card`;
                card.innerHTML = `<div class="record-meta"><span>${currentAgent.toUpperCase()}</span><span>STARDATE: ${rec.stardate}</span></div><div class="record-title">${rec.title}</div><div class="record-body">${rec.content}</div>`;
                container.appendChild(card);
            });
        }

        async function publishRecord() {
            const title = document.getElementById('record-title').value.trim();
            const content = document.getElementById('record-content').value.trim();
            if(!title || !content) return alert('Заповніть поля!');
            const stardate = (8000 + Math.floor(Math.random() * 1000)).toString();
            await fetch('/api/records', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agent_type: currentAgent, title, content, stardate }) });
            document.getElementById('record-title').value = ''; document.getElementById('record-content').value = '';
            loadRecords();
        }

        async function loadChat() {
            const res = await fetch('/api/chat');
            const messages = await res.json();
            const chat = document.getElementById('chat-messages');
            chat.innerHTML = `<div class="chat-msg msg-system"><div class="msg-sender">Голос Терри (ШІ-Стрімер)</div>Вітаємо підписників! Оріон — це слава Імперії!</div>`;
            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = `chat-msg ${msg.sender === 'Командир' ? 'msg-user' : 'msg-system'}`;
                item.innerHTML = `<div class="msg-sender">${msg.sender}</div>${msg.text}`;
                chat.appendChild(item);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: 'Командир', text }) });
            input.value = ''; await loadChat();
            setTimeout(async () => {
                const reactions = [
                    "Аналітик 'Квантовий Вектор': Цифри з Канцелярії доводять зростання виробництва.",
                    "Голос Терри (ШІ-Стрімер): Це бомба! Нехай усі знають про нашу велич!",
                    "Імперський Інсайдер: Секретні логи підтверджують контроль над регіонами."
                ];
                const reply = reactions[Math.floor(Math.random() * reactions.length)];
                await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: 'ШІ-Інфлюенсер', text: reply }) });
                loadChat();
            }, 1200);
        }
    </script>
</body>
</html>
