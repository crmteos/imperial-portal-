<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>ІМПЄРСКІЄ ВЄДОМОСТІ | Головний Медіапортал Метрополії</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Orbitron:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #dfb76c; 
            --gold-glow: rgba(223,183,108,0.4); 
            --imperial-red: #ff3333; 
            --red-glow: rgba(255,51,51,0.3);
            --bg-dark: #07080c; 
            --panel-bg: rgba(15,17,26,0.9); 
            --border-color: #212435; 
            --text-light: #e2e8f0; 
            --text-muted: #747d9e; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg-dark); 
            color: var(--text-light); 
            font-family: 'Montserrat', sans-serif; 
            min-height: 100vh; 
            overflow-x: hidden;
        }
        
        /* HEADER WITH INTEGRATED RADIO */
        header { 
            background: linear-gradient(180deg, #090a0f 0%, #12141d 100%); 
            border-bottom: 2px solid var(--gold); 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo-block {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .imperial-crest { 
            width: 45px; 
            height: 45px; 
            background: radial-gradient(circle, var(--gold) 30%, transparent 70%); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: 'Orbitron'; 
            font-size: 22px; 
            color: #000; 
            font-weight: 900; 
            border: 2px solid var(--gold); 
            box-shadow: 0 0 10px var(--gold-glow);
        }
        
        .header-titles h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--gold);
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--gold-glow);
        }
        
        .header-titles p {
            font-size: 9px;
            color: var(--imperial-red);
            font-family: 'Orbitron';
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Radio player in header */
        .header-radio {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            padding: 5px 15px;
            border-radius: 6px;
        }

        .radio-play-btn {
            background: #39ff14;
            color: #000;
            border: none;
            padding: 5px 15px;
            font-family: 'Orbitron';
            font-weight: bold;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(57,255,20,0.3);
            transition: all 0.2s;
        }
        
        .radio-play-btn:hover {
            transform: scale(1.05);
        }

        .radio-visualizer {
            width: 80px;
            height: 18px;
            background: repeating-linear-gradient(90deg, transparent, transparent 2px, #39ff14 2px, #39ff14 4px);
            opacity: 0.5;
            border-radius: 2px;
        }

        .radio-visualizer.playing {
            animation: pulse 0.5s infinite alternate;
            opacity: 0.9;
        }

        /* THREE-COLUMN LAYOUT */
        .portal-grid { 
            max-width: 1650px; 
            margin: 30px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 1fr 1.2fr 1fr; 
            gap: 25px; 
        }
        
        @media (max-width: 1200px) {
            .portal-grid { grid-template-columns: 1fr 1fr; }
            .column:last-child { grid-column: span 2; }
        }
        
        @media (max-width: 768px) {
            .portal-grid { grid-template-columns: 1fr; }
            .column:last-child { grid-column: span 1; }
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .column-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--gold);
            text-transform: uppercase;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feed-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 75vh;
            overflow-y: auto;
            padding-right: 8px;
        }

        /* ARTICLE CARDS */
        .news-card { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            padding: 15px; 
            transition: all 0.3s ease;
            position: relative;
        }
        
        .news-card:hover { 
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(223,183,108,0.05);
        }
        
        .news-card.active-highlight {
            border-color: var(--imperial-red);
            box-shadow: 0 0 15px var(--red-glow);
        }

        .card-meta { 
            display: flex; 
            justify-content: space-between; 
            font-size: 8px; 
            font-family: 'Orbitron'; 
            color: var(--text-muted); 
            margin-bottom: 8px;
        }
        
        .card-title { 
            font-size: 14px; 
            font-weight: bold; 
            color: #fff; 
            line-height: 1.3;
            margin-bottom: 8px;
        }
        
        .card-excerpt { 
            font-size: 11px; 
            color: var(--text-light); 
            line-height: 1.4;
            opacity: 0.85;
        }
        
        .card-tags { 
            font-size: 9px; 
            color: var(--gold); 
            margin-top: 10px; 
            font-family: 'Orbitron';
        }

        .read-more-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 5px 12px;
            font-family: 'Orbitron';
            font-size: 9px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
            display: inline-block;
            transition: all 0.2s;
        }

        .read-more-btn:hover {
            background: var(--gold);
            color: #000;
        }

        /* REGIONAL IMAGES FOR LONGRIDS */
        .card-image {
            width: 100%;
            height: 120px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* MODAL READ VIEW FOR LONGRIDS */
        .reader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5,6,10,0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reader-box {
            background: #10121a;
            border: 2px solid var(--gold);
            border-radius: 8px;
            max-width: 800px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px var(--gold-glow);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Orbitron';
        }

        .close-btn:hover {
            color: var(--gold);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        @keyframes pulse {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.4); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-block">
            <div class="imperial-crest">I</div>
            <div class="header-titles">
                <h1>ІМПЄРСКІЄ ВЄДОМОСТІ</h1>
                <p>ОФИЦИАЛЬНЫЙ ТАКТИЧЕСКИЙ ОРГАН ВЕЩАНИЯ УКРАИНЫ-МЕТРОПОЛИИ</p>
            </div>
        </div>
        
        <!-- Live Radio in Header -->
        <div class="header-radio">
            <span style="font-family:'Orbitron'; font-size:9px; color:#39ff14;">ЛУЧИНА-FM</span>
            <button class="radio-play-btn" id="radio-play-btn" onclick="toggleRadioPlay()">PLAY</button>
            <div class="radio-visualizer" id="radio-visualizer"></div>
        </div>
    </header>

    <div class="portal-grid">
        
        <!-- COLUMN 1: REPORTER (NEWS) -->
        <div class="column">
            <h2 class="column-title">📡 Оперативныя Вєдомости</h2>
            <div class="feed-container" id="reporter-feed"></div>
        </div>

        <!-- COLUMN 2: ARCHIVIST (LONGRIDS) -->
        <div class="column">
            <h2 class="column-title">📚 Историческій Архивъ</h2>
            <div class="feed-container" id="archivist-feed"></div>
        </div>

        <!-- COLUMN 3: FUTUROLOGIST (FORESIGHTS) -->
        <div class="column">
            <h2 class="column-title">🔮 Прогнозы и Форсайты</h2>
            <div class="feed-container" id="futurist-feed"></div>
        </div>

    </div>

    <!-- FULL ARTICLE READER MODAL -->
    <div class="reader-modal" id="reader-modal" onclick="closeModal(event)">
        <div class="reader-box" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="modal-content-area"></div>
        </div>
    </div>

    <script>
        var isPlaying = false;
        var audioCtx = null;
        var synth = window.speechSynthesis;

        const regionImages = {
            kyiv: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&auto=format&fit=crop",
            konigsberg: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800&auto=format&fit=crop",
            kursk: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=800&auto=format&fit=crop",
            belgorod: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop",
            moscovia: "https://images.unsplash.com/photo-1539650116574-8efeb43e2750?w=800&auto=format&fit=crop"
        };

        document.addEventListener('DOMContentLoaded', function() { 
            // Завантажуємо всі колонки одночасно
            loadColumn('reporter', 'reporter-feed');
            loadColumn('archivist', 'archivist-feed');
            loadColumn('futurist', 'futurist-feed');

            // Обробка посилання з Telegram (автоматичний перехід та відкриття статті)
            var urlParams = new URLSearchParams(window.location.search);
            var articleId = urlParams.get('id');
            if (articleId) {
                fetch('/api/record-detail/' + articleId)
                    .then(function(res) { return res.json(); })
                    .then(function(rec) {
                        if (rec) {
                            openArticleModal(rec);
                        }
                    });
            }
        });

        function loadColumn(agent, containerId) {
            return fetch('/api/records/' + agent)
                .then(function(res) { return res.json(); })
                .then(function(records) {
                    var container = document.getElementById(containerId);
                    container.innerHTML = '';
                    if (records.length === 0) {
                        container.innerHTML = '<div style="color: var(--text-muted); font-size:11px; text-align:center; padding-top:20px;">Пространство пусто.</div>';
                        return;
                    }
                    records.forEach(function(rec) {
                        var card = document.createElement('div');
                        card.className = 'news-card';
                        card.id = 'card-' + rec.id;
                        
                        var imageHtml = '';
                        if (agent === 'archivist') {
                            var imgUrl = regionImages[rec.region_key] || regionImages.kyiv;
                            imageHtml = '<div class="card-image" style="background-image: url(\' + imgUrl + '\')"></div>';
                        }

                        card.innerHTML = imageHtml + 
                            '<div class="card-meta"><span>[' + rec.content_type.toUpperCase() + ']</span><span>STARDATE: ' + rec.stardate + '</span></div>' +
                            '<div class="card-title">' + rec.title + '</div>' +
                            '<div class="card-excerpt">' + rec.content.substring(0, 110) + '...</div>' +
                            '<div class="card-tags">' + rec.hashtags + '</div>' +
                            '<button class="read-more-btn" onclick=\'openArticleModal(' + JSON.stringify(rec) + ')\'>Читать полностью</button>';
                        container.appendChild(card);
                    });
                });
        }

        function openArticleModal(rec) {
            var imgUrl = regionImages[rec.region_key] || regionImages.kyiv;
            var area = document.getElementById('modal-content-area');
            
            // Надаємо статті красиву журнальну верстку
            area.innerHTML = `
                <div class="card-image" style="height:250px; background-image: url('\${imgUrl}')"></div>
                <div style="font-family:'Orbitron'; font-size:10px; color:var(--gold); margin-bottom:10px;">
                    [ШИФР: UA-EMP-\${rec.epoch_key}-\${rec.id}] | [\${rec.content_type.toUpperCase()}]
                </div>
                <h2 style="font-family:'Cinzel'; color:var(--gold); font-size:24px; margin-bottom:20px; border-bottom:2px double var(--gold); padding-bottom:10px; line-height:1.2;">
                    \${rec.title.toUpperCase()}
                </h2>
                <div style="font-size:13px; color:var(--text-light); line-height:1.6; font-style:italic; margin-bottom:20px; white-space:pre-wrap;">
                    \${rec.content}
                </div>
                <div style="font-family:'Orbitron'; font-size:11px; color:var(--gold); margin-top:20px;">
                    \${rec.hashtags}
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); border-top:1px solid var(--border-color); padding-top:10px; margin-top:20px;">
                    <span>ЗВЕДЕНО В ВЄДОМОСТІ: \${rec.stardate}</span>
                    <span>ОРГАН: ЦЕНТРАЛЬНАЯ КАНЦЕЛЯРИЯ</span>
                </div>
            `;
            
            document.getElementById('reader-modal').style.display = 'flex';
            
            // Виділяємо оригінальну картку в сітці новин
            document.querySelectorAll('.news-card').forEach(c => c.classList.remove('active-highlight'));
            var origCard = document.getElementById('card-' + rec.id);
            if (origCard) {
                origCard.classList.add('active-highlight');
                origCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function closeModal() {
            document.getElementById('reader-modal').style.display = 'none';
        }

        // РАДІОЛОГІКА
        function playChiptuneJingle() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var notes = [261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63];
                var tempo = 0.15;
                notes.forEach(function(freq, index) {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime + index * tempo);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (index + 1) * tempo);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + index * tempo);
                    osc.stop(audioCtx.currentTime + (index + 1) * tempo);
                });
            } catch(e) {}
        }

        function toggleRadioPlay() {
            isPlaying = !isPlaying;
            var btn = document.getElementById('radio-play-btn');
            var vis = document.getElementById('radio-visualizer');
            if (isPlaying) {
                btn.innerText = 'STOP';
                btn.style.background = '#ff3333';
                vis.className = 'radio-visualizer playing';
                playChiptuneJingle();
            } else {
                btn.innerText = 'PLAY';
                btn.style.background = '#39ff14';
                vis.className = 'radio-visualizer';
                if(synth) synth.cancel();
            }
        }
    </script>
</body>
</html>
