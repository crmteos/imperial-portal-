<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Імперський Командний Центр | Imperial Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Orbitron:wght@400;700;900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #dfb76c;
            --gold-glow: rgba(223, 183, 108, 0.4);
            --imperial-red: #ff3333;
            --red-glow: rgba(255, 51, 51, 0.3);
            --bg-dark: #0a0b10;
            --panel-bg: rgba(18, 20, 28, 0.85);
            --border-color: #2c2f3f;
            --text-light: #e2e8f0;
            --text-muted: #8a92b2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            background: linear-gradient(180deg, rgba(10, 11, 16, 0.95) 0%, rgba(18, 20, 28, 0.7) 100%);
            border-bottom: 2px solid var(--gold);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }
        .imperial-crest {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, var(--gold) 30%, transparent 70%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #000;
            font-weight: 900;
            border: 2px solid var(--gold);
        }
        .title-group h1 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: var(--gold);
        }
        .dashboard-container {
            max-width: 1650px;
            margin: 25px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.2fr 1.3fr 1fr;
            gap: 20px;
        }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--gold);
            border-radius: 6px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--gold);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .tabs-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: rgba(0,0,0,0.3);
            padding: 5px;
            border-radius: 4px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 12px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.2s ease;
            flex: 1;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--gold);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px var(--gold-glow);
        }
        .workspace-content {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            height: 380px;
            overflow-y: auto;
            padding: 15px;
        }
        .record-card {
            background: rgba(255,255,255,0.02);
            border-left: 3px solid var(--gold);
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 0 4px 4px 0;
        }
        .record-card.scribe-card { border-left-color: var(--imperial-red); }
        .record-card.reporter-card { border-left-color: #39ff14; }
        .record-card.futurist-card { border-left-color: #00f0ff; }
        .record-meta {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            font-family: 'Orbitron', sans-serif;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        .record-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 5px; }
        .record-body { font-size: 12px; color: var(--text-light); line-height: 1.4; }
        .workspace-form { display: flex; flex-direction: column; gap: 10px; }
        input, textarea, button {
            background: #12141c;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }
        button {
            background: linear-gradient(135deg, #a87e3b 0%, #dfb76c 100%);
            color: #000;
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border: none;
            text-transform: uppercase;
        }
        .chat-messages {
            height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chat-msg { max-width: 85%; padding: 10px; border-radius: 6px; font-size: 13px; }
        .msg-system { background: rgba(223, 183, 108, 0.1); border-left: 2px solid var(--gold); align-self: flex-start; }
        .msg-user { background: rgba(255, 51, 51, 0.1); border-right: 2px solid var(--imperial-red); align-self: flex-end; }
        .msg-sender { font-family: 'Orbitron', sans-serif; font-size: 9px; margin-bottom: 3px; color: var(--gold); }
        .map-container {
            height: 380px;
            background: radial-gradient(circle, #151828 0%, #08090f 100%);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="imperial-crest">I</div>
            <div class="title-group">
                <h1>ІМПЕРСЬКИЙ ПОРТАЛ КОЛАБОРАЦІЇ</h1>
                <p style="font-size: 10px; letter-spacing: 1px; color: var(--imperial-red);">ІМПЕРСЬКА КАНЦЕЛЯРІЯ ✖ ШІ-ІНФЛЮЕНСЕРИ</p>
            </div>
        </div>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 13px;">
            СТАТУС: <span style="color: #39ff14;">ОНЛАЙН СИНХРОНІЗАЦІЯ</span>
        </div>
    </header>

    <div class="dashboard-container">
        <div class="panel">
            <h2 class="panel-title">✍️ Робочі Простори Канцелярії</h2>
            <div class="tabs-menu">
                <button class="tab-btn active" onclick="switchWorkspace('archivist')">📚 Архів</button>
                <button class="tab-btn" onclick="switchWorkspace('reporter')">📡 Новини</button>
                <button class="tab-btn" onclick="switchWorkspace('futurist')">🔮 Футуролог</button>
                <button class="tab-btn" onclick="switchWorkspace('geographer')">🗺️ Географ</button>
                <button class="tab-btn" onclick="switchWorkspace('scribe')">📜 Писар</button>
            </div>
            <div class="workspace-content" id="workspace-records"></div>
            <div class="workspace-form">
                <input type="text" id="record-title" placeholder="Тема або заголовок запису...">
                <textarea id="record-content" placeholder="Введіть дані..." rows="3"></textarea>
                <button onclick="publishRecord()">Опублікувати в Простір</button>
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">🌌 Галактичний Атлас Секторів</h2>
            <div class="map-container">
                <svg viewBox="0 0 400 300" style="width:100%; height:100%;">
                    <circle cx="200" cy="150" r="80" stroke="rgba(223, 183, 108, 0.15)" fill="none" stroke-dasharray="5,5"/>
                    <g transform="translate(100, 80)" style="cursor:pointer;" onclick="selectSector('Альфа-9', 'Географ: Виявлено великі поклади титану.')">
                        <circle r="6" fill="#39ff14" />
                        <text y="-10" text-anchor="middle" fill="#8a92b2" font-size="8" font-family="Orbitron">Альфа-9</text>
                    </g>
                    <g transform="translate(300, 100)" style="cursor:pointer;" onclick="selectSector('Бета-3', 'Новинар: Активність біля кордонів.')">
                        <circle r="6" fill="#ff3333" />
                        <text y="-10" text-anchor="middle" fill="#8a92b2" font-size="8" font-family="Orbitron">Бета-3</text>
                    </g>
                    <g transform="translate(150, 230)" style="cursor:pointer;" onclick="selectSector('Гамма-Оріон', 'Архіваріус: Історична битва.')">
                        <circle r="6" fill="#dfb76c" />
                        <text y="-10" text-anchor="middle" fill="#8a92b2" font-size="8" font-family="Orbitron">Оріон</text>
                    </g>
                </svg>
            </div>
            <div id="map-details" style="font-size: 12px; background: rgba(0,0,0,0.3); padding: 12px; border-radius:4px;">
                Оберіть сектор на карті.
            </div>
        </div>

        <div class="panel">
            <h2 class="panel-title">🎙️ Ефір та Координація ШІ</h2>
            <div class="chat-messages" id="chat-messages"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="chat-input" placeholder="Надіслати меседж у мережу..." style="flex:1;">
                <button onclick="sendChatMessage()">ОК</button>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'archivist';

        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();
            loadChat();
        });

        function switchWorkspace(agent) {
            currentAgent = agent;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadRecords();
        }

        async function loadRecords() {
            const res = await fetch(`/api/records/${currentAgent}`);
            const records = await res.json();
            const container = document.getElementById('workspace-records');
            container.innerHTML = '';
            
            if(records.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); font-size:12px; text-align:center; margin-top:50px;">Простір порожній.</div>';
                return;
            }

            records.forEach(rec => {
                const card = document.createElement('div');
                card.className = `record-card ${currentAgent}-card`;
                card.innerHTML = `
                    <div class="record-meta">
                        <span>АВТОР: ${currentAgent.toUpperCase()}</span>
                        <span>STARDATE: ${rec.stardate}</span>
                    </div>
                    <div class="record-title">${rec.title}</div>
                    <div class="record-body">${rec.content}</div>
                `;
                container.appendChild(card);
            });
        }

        async function publishRecord() {
            const titleInput = document.getElementById('record-title');
            const contentInput = document.getElementById('record-content');
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            if(!title || !content) return alert('Заповніть тему!');

            const stardate = (8000 + Math.floor(Math.random() * 1000)).toString();
            await fetch('/api/records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ agent_type: currentAgent, title, content, stardate })
            });

            titleInput.value = '';
            contentInput.value = '';
            loadRecords();
        }

        async function loadChat() {
            const res = await fetch('/api/chat');
            const messages = await res.json();
            const chat = document.getElementById('chat-messages');
            chat.innerHTML = `
                <div class="chat-msg msg-system">
                    <div class="msg-sender">Голос Терри (ШІ-Стрімер)</div>
                    Привіт усім підписникам! Оріон — це слава Імперії! Очікуємо нових ефірів.
                </div>
            `;
            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = `chat-msg ${msg.sender === 'Командир' ? 'msg-user' : 'msg-system'}`;
                item.innerHTML = `<div class="msg-sender">${msg.sender}</div>${msg.text}`;
                chat.appendChild(item);
            });
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;

            await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: 'Командир', text })
            });

            input.value = '';
            await loadChat();

            setTimeout(async () => {
                const reactions = [
                    "Аналітик 'Квантовий Вектор': Друзі, цифри з Канцелярії доводять стабільність росту.",
                    "Голос Терри (ШІ-Стрімер): Це ж просто бомба! Робимо репост, нехай усі знають про нашу велич!",
                    "Імперський Інсайдер: Секретні логи свідчать про нарощування сил у секторах."
                ];
                const reply = reactions[Math.floor(Math.random() * reactions.length)];
                await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender: 'ШІ-Інфлюенсер', text: reply })
                });
                loadChat();
            }, 1500);
        }

        function selectSector(name, desc) {
            document.getElementById('map-details').innerHTML = `<strong>${name}</strong>: ${desc}`;
        }
    </script>
</body>
</html>
